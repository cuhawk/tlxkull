[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tlx-bounty-lean"
version = "0.1.0"
description = "Lean TLX subset for the bug-bounty cockpit workspace"
requires-python = ">=3.11"
authors = [{ name = "Cuhawk" }]
license = { text = "Proprietary" }

# Trimmed from upstream TLX. Dropped:
#  - ddgs        (modules/crawler removed)
#  - bcrypt/PyJWT (modules/ui_server removed)
# Kept playwright because modules/mock_backend uses it for sink observation.
dependencies = [
    # Engines (used by advisor pipeline inside js_analyzer audit loop)
    "google-genai>=0.3.0",
    "anthropic>=0.40.0",

    # Core
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
    "platformdirs>=4.2.0",

    # HTTP fetching (kept — used by misc helpers / sourcemap fetch fallback)
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",

    # Mock backend (internal Playwright sink confirmation + FastAPI mock server)
    "playwright>=1.40.0",
    "fastapi>=0.110.0",

    # Docs / RAG
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "ebooklib>=0.18",
    "markdown-it-py>=3.0.0",

    # MCP transport
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# No tlx CLI entry point in this subset — surface is MCP only. The workspace
# wraps this lean install via the Claude Code MCP client.

[tool.hatch.build.targets.wheel]
packages = ["kernel", "mcp_server", "modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_server/tests", "modules/*/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# GFA-ported files held read-only by the phase 4 spec.
"modules/js_analyzer/callgraph.py" = ["E701", "B905"]
"modules/js_analyzer/taxonomy.py" = ["B904"]

[tool.mypy]
python_version = "3.11"
strict = true
# Pragmatic relaxations: bare `dict`/`list` annotations and untyped helpers
# are entrenched here. These rules catch paperwork, not bugs. Semantic
# checks (union-attr, arg-type, return-value, attr-defined, operator,
# index, no-redef) stay on — those catch real defects.
disallow_any_generics = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
ignore_missing_imports = true
exclude = [
    # GFA-ported files held read-only by the phase 4 spec.
    "^modules/js_analyzer/(callgraph|callgraph_tools|taint|interprocedural_taint|pathfind|taxonomy|sourcemap|template_analyzer|pp_chains)\\.py$",
]

[[tool.mypy.overrides]]
# Tests use mocks and dynamic fixtures. Strict typing here = noise, not signal.
module = ["tests.*", "modules.*.tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disallow_any_generics = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
# GFA-ported files held read-only by the phase 4 spec.
module = [
    "modules.js_analyzer.callgraph",
    "modules.js_analyzer.callgraph_tools",
    "modules.js_analyzer.taint",
    "modules.js_analyzer.interprocedural_taint",
    "modules.js_analyzer.pathfind",
    "modules.js_analyzer.taxonomy",
    "modules.js_analyzer.sourcemap",
    "modules.js_analyzer.template_analyzer",
    "modules.js_analyzer.pp_chains",
    "callgraph",
    "callgraph_tools",
    "taint",
    "interprocedural_taint",
    "pathfind",
    "taxonomy",
    "sourcemap",
    "template_analyzer",
    "pp_chains",
    "framework_detect",
    "ast_extractor",
    "deobfuscate_wrapper",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_expr = false