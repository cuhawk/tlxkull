[project]
name = "recon-mcp"
version = "0.1.0"
description = "Ephemeral-droplet recon MCP for TLX"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
    "asyncssh>=2.18",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pyfakefs>=5.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recon_mcp", "recon_mcp.handlers"]

[tool.setuptools.package-dir]
"recon_mcp" = "."
"recon_mcp.handlers" = "handlers"
